[env:esp32-c3-devkitm-1]
; PINNED on purpose: code uses Arduino core 2.x LEDC API (ledcSetup/ledcAttachPin/
; ledcWriteTone) which was REMOVED in core 3.x. 6.11.0 is the last PlatformIO
; release shipping core 2.x. Do not bump without migrating the buzzer code.
platform = espressif32@6.11.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.f_cpu = 160000000L

board_build.arduino.usb_cdc_on_boot = enable
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200

lib_deps =
    https://github.com/nstepanets/ST7567.git
    adafruit/Adafruit GFX Library
    adafruit/Adafruit NeoPixel
